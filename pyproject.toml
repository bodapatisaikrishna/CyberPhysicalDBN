[project]
name = "cyberphysicaldbn"
version = "0.1.0"
description = "Cyber-Physical DBN with Learned Perception and Closed Physical Loop"
requires-python = ">=3.11,<3.12"
readme = "CLAUDE.md"

# Exact versions below are the ones actually installed by `uv` and verified
# by scripts/verify_stack.py on 2026-07-30 (macOS-15.7.2-arm64, Python 3.11.7).
# Every pin traces to that observed, passing run (CLAUDE.md rule 1).
dependencies = [
    "pandapower==3.5.4",
    "pgmpy==1.1.2",
    "torch==2.13.0",
    "torch-geometric==2.8.0.post1",
    "simpy==4.1.2",
    "networkx==3.6.1",
    "scikit-learn==1.9.0",
    "stable-baselines3==2.9.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "pandas==2.3.3",
    "matplotlib==3.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
